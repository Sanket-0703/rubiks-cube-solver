name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os-name }} · ${{ matrix.compiler }} · ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, os-name: macOS, compiler: AppleClang, preset: debug }
          - { os: macos-latest, os-name: macOS, compiler: AppleClang, preset: asan }
          - { os: macos-latest, os-name: macOS, compiler: AppleClang, preset: release }
          - { os: ubuntu-24.04, os-name: Ubuntu, compiler: gcc-14, cxx: g++-14, preset: debug }
          - { os: ubuntu-24.04, os-name: Ubuntu, compiler: gcc-14, cxx: g++-14, preset: asan }
          - { os: ubuntu-24.04, os-name: Ubuntu, compiler: clang-18, cxx: clang++-18, preset: debug }
          - { os: ubuntu-24.04, os-name: Ubuntu, compiler: clang-18, cxx: clang++-18, preset: release }
    env:
      CXX: ${{ matrix.cxx || 'c++' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Benchmark smoke run
        if: matrix.preset == 'release'
        run: ./build/release/bench/cubecore_bench --benchmark_min_time=0.05s

      - name: Build info
        run: ./build/${{ matrix.preset }}/apps/cubesolver/cubesolver info

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install clang-format==23.1.3
      - run: scripts/format.sh --check

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install clang-tidy==23.1.3
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset debug
      - run: scripts/tidy.sh build/debug

  coverage:
    name: coverage (≥ 85% of cubecore lines)
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
      LLVM_PROFDATA: llvm-profdata-18
      LLVM_COV: llvm-cov-18
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build llvm-18
      - run: scripts/coverage.sh --fail-under 85
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### cubecore coverage'
            echo '```'
            cat build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: build/coverage/html
